<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f7f9"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>

  <!-- Title -->
  <text x="600" y="56" text-anchor="middle" font-size="22" font-weight="700" fill="#0a0a0a">Your AI Factory Floor</text>
  <text x="600" y="84" text-anchor="middle" font-size="14" fill="#6b7280">Four parts. One verdict. Colored by your answers.</text>

  <!-- Quadrant frame -->
  <g transform="translate(220,130)">
    <!-- soft glows behind each quadrant (color = answer state) -->
    <circle cx="190" cy="160" r="150" fill="#10b981" opacity="0.10" filter="url(#soft)"/>     <!-- Standard: green -->
    <circle cx="570" cy="160" r="150" fill="#f59e0b" opacity="0.12" filter="url(#soft)"/>     <!-- Line: amber -->
    <circle cx="190" cy="430" r="150" fill="#ef4444" opacity="0.12" filter="url(#soft)"/>     <!-- QA: red -->
    <circle cx="570" cy="430" r="150" fill="#94a3b8" opacity="0.14" filter="url(#soft)"/>     <!-- Meter: neutral/grey -->

    <!-- Grid -->
    <rect x="0" y="0" width="760" height="540" rx="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <line x1="380" y1="20" x2="380" y2="520" stroke="#e5e7eb" stroke-width="1.5"/>
    <line x1="20" y1="270" x2="740" y2="270" stroke="#e5e7eb" stroke-width="1.5"/>

    <!-- Q1: STANDARD (top-left, green / Yes) -->
    <g transform="translate(40,40)">
      <text font-size="11" letter-spacing="2" fill="#10b981" font-weight="700">01 / STANDARD</text>
      <text y="34" font-size="22" font-weight="700" fill="#0a0a0a">Definition of "good"</text>
      <text y="62" font-size="13" fill="#4b5563">Written. Agreed. Held to.</text>
      <!-- icon: document with checkmark -->
      <g transform="translate(0,90)">
        <rect width="60" height="76" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
        <line x1="12" y1="20" x2="48" y2="20" stroke="#10b981" stroke-width="2"/>
        <line x1="12" y1="32" x2="48" y2="32" stroke="#10b981" stroke-width="2"/>
        <line x1="12" y1="44" x2="36" y2="44" stroke="#10b981" stroke-width="2"/>
        <circle cx="50" cy="58" r="12" fill="#10b981"/>
        <path d="M44,58 L48,62 L56,54" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <!-- status chip -->
      <g transform="translate(0,200)">
        <rect width="90" height="22" rx="11" fill="#10b981"/>
        <text x="45" y="15" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">YES, WRITTEN</text>
      </g>
    </g>

    <!-- Q2: LINE (top-right, amber / Sort-of) -->
    <g transform="translate(420,40)">
      <text font-size="11" letter-spacing="2" fill="#f59e0b" font-weight="700">02 / LINE</text>
      <text y="34" font-size="22" font-weight="700" fill="#0a0a0a">Repeatable shape</text>
      <text y="62" font-size="13" fill="#4b5563">Same input. Same output. Every time.</text>
      <!-- icon: three identical stacked bars + one drifted -->
      <g transform="translate(0,90)">
        <rect x="0"  y="20" width="50" height="14" rx="3" fill="#f59e0b"/>
        <rect x="0"  y="40" width="50" height="14" rx="3" fill="#f59e0b"/>
        <rect x="0"  y="60" width="58" height="14" rx="3" fill="#f59e0b" opacity="0.55"/>
        <rect x="0"  y="80" width="42" height="14" rx="3" fill="#f59e0b" opacity="0.35"/>
      </g>
      <g transform="translate(0,200)">
        <rect width="120" height="22" rx="11" fill="#f59e0b"/>
        <text x="60" y="15" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">DEPENDS ON PERSON</text>
      </g>
    </g>

    <!-- Q3: QA (bottom-left, red / No) -->
    <g transform="translate(40,310)">
      <text font-size="11" letter-spacing="2" fill="#ef4444" font-weight="700">03 / QA</text>
      <text y="34" font-size="22" font-weight="700" fill="#0a0a0a">In-line check</text>
      <text y="62" font-size="13" fill="#4b5563">Catches wrong before it ships.</text>
      <!-- icon: shield with X / hole -->
      <g transform="translate(0,90)">
        <path d="M30,5 L60,18 V44 C60,62 46,76 30,82 C14,76 0,62 0,44 V18 Z"
              fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
        <line x1="18" y1="32" x2="42" y2="56" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
        <line x1="42" y1="32" x2="18" y2="56" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
      </g>
      <g transform="translate(0,200)">
        <rect width="130" height="22" rx="11" fill="#ef4444"/>
        <text x="65" y="15" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">WHOEVER NOTICES</text>
      </g>
    </g>

    <!-- Q4: METER (bottom-right, grey / unknown) -->
    <g transform="translate(420,310)">
      <text font-size="11" letter-spacing="2" fill="#64748b" font-weight="700">04 / METER</text>
      <text y="34" font-size="22" font-weight="700" fill="#0a0a0a">Cost &amp; rework</text>
      <text y="62" font-size="13" fill="#4b5563">Per output. Today. Defensible.</text>
      <!-- icon: gauge with needle pointing at "?" -->
      <g transform="translate(0,90)">
        <path d="M5,75 A50,50 0 0 1 105,75" fill="none" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/>
        <path d="M5,75 A50,50 0 0 1 35,32" fill="none" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>
        <line x1="55" y1="75" x2="55" y2="40" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
        <circle cx="55" cy="75" r="5" fill="#475569"/>
        <text x="55" y="98" text-anchor="middle" font-size="22" font-weight="800" fill="#94a3b8">?</text>
      </g>
      <g transform="translate(0,200)">
        <rect width="70" height="22" rx="11" fill="#64748b"/>
        <text x="35" y="15" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">NEITHER</text>
      </g>
    </g>
  </g>

  <!-- Verdict strip -->
  <g transform="translate(220,700)">
    <rect width="760" height="42" rx="10" fill="#0a0a0a"/>
    <text x="22" y="27" font-size="13" font-weight="700" letter-spacing="1.5" fill="#ffffff">VERDICT</text>
    <text x="110" y="27" font-size="13" fill="#e5e7eb">Workshop. Weakest part: <tspan fill="#ef4444" font-weight="700">QA</tspan>. Install one automated check in 30 days.</text>
  </g>

  <!-- Legend -->
  <g transform="translate(220,660)" font-size="11" fill="#6b7280">
    <circle cx="6"   cy="-3" r="5" fill="#10b981"/><text x="18"  y="0">Installed</text>
    <circle cx="100" cy="-3" r="5" fill="#f59e0b"/><text x="112" y="0">Partial</text>
    <circle cx="180" cy="-3" r="5" fill="#ef4444"/><text x="192" y="0">Missing</text>
    <circle cx="270" cy="-3" r="5" fill="#94a3b8"/><text x="282" y="0">Unknown</text>
  </g>
</svg>
